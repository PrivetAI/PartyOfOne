workflows:
  ios-native-quick-start:
    name: iOS Native
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: 'Party of One'
    environment:
      ios_signing:
        # Только сертификат: его приватный ключ есть лишь у Codemagic, который
        # этот сертификат и выпустил. Профили сюда прописать нельзя — загрузка
        # .mobileprovision в хранилище Codemagic не работает.
        certificates:
          - 'Party of One'
      vars:
        BUNDLE_ID: "com.karlokovacic.partyofone"
        XCODE_WORKSPACE: "Party of One.xcodeproj"
        XCODE_SCHEME: "Party of One"
      xcode: latest
    scripts:
      # Профили забираем прямо из Apple по ключу ASC. list-profiles --save
      # кладёт их в ~/Library/MobileDevice/Provisioning Profiles и, в отличие
      # от fetch-signing-files, не требует приватного ключа сертификата.
      - name: Fetch provisioning profiles
        script: |
          app-store-connect list-profiles \
            --bundle-id-identifier "$BUNDLE_ID" \
            --profile-type IOS_APP_STORE \
            --save
      - name: Set up provisioning profiles settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
